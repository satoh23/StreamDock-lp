<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <title>StreamDock｜配信ツールをまとめて起動・停止できるデスクトップアプリ</title>
    <meta
      name="description"
      content="よく使う配信ツールをまとめておくと、10 個でも 100 個でもワンクリックで立ち上がります。YouTube と Twitch のコメントを同時に表示できるコメントビューアも内蔵。macOS / Windows 対応、基本無料。"
    />
    <link rel="canonical" href="%VITE_SITE_URL%/" />

    <!-- ⚠ og:image と og:url は**絶対 URL でないといけない**。
         X・Discord・LINE のクローラーは相対パスを解決しないので、
         相対にすると画像なしのカードになる。URL は .env の VITE_SITE_URL が元。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StreamDock" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta
      property="og:title"
      content="StreamDock｜配信ツールをまとめて起動・停止できるデスクトップアプリ"
    />
    <meta
      property="og:description"
      content="よく使う配信ツールをまとめておくと、10 個でも 100 個でもワンクリックで立ち上がります。コメントビューアも内蔵。macOS / Windows 対応、基本無料。"
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="StreamDock" />
    <meta property="og:locale" content="ja_JP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="StreamDock｜配信ツールをまとめて起動・停止できるデスクトップアプリ"
    />
    <meta
      name="twitter:description"
      content="よく使う配信ツールをまとめておくと、10 個でも 100 個でもワンクリックで立ち上がります。コメントビューアも内蔵。macOS / Windows 対応、基本無料。"
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "StreamDock",
        "url": "%VITE_SITE_URL%/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "macOS, Windows",
        "description": "配信で使うツールをプリセットにまとめて、一括で起動・停止できるデスクトップアプリ。YouTube と Twitch のコメントを同時に表示できるコメントビューアを内蔵。",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "JPY"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
